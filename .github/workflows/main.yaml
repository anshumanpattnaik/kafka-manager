name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  check_direct_push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Direct Push
        run: |
          echo "Direct pushes to the main branch are not allowed. Please create a pull request."
          exit 1

  lint_and_test:
    needs: check_direct_push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest docker-compose  # Add docker-compose
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F70,F72,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=127 --statistics
      - name: Set up Docker Compose
        uses: docker/setup-docker-compose@v2
        with:
          version: 'v2'
      - name: Start Kafka Broker
        run: docker-compose up -d
      - name: Wait for Kafka to start
        run: |
          # Wait for the Kafka broker to be available.  Adjust the timeout as needed.
          timeout 60 bash -c 'until nc -z localhost 9092; do echo "Waiting for Kafka..."; sleep 2; done; echo "Kafka is up!"'
      - name: Run Unit Tests with pytest
        run: |
          pytest -v ./tests/unit  # Run unit tests
      - name: Run Integration Tests with pytest
        run: |
          pytest -v ./tests/integration # Run integration tests
      - name: Tear down Docker Compose
        if: always()
        run: docker-compose down
