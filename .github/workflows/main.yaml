name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F70,F72,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=127 --statistics
      - name: Install Docker
        run: |
            curl -fsSL https://get.docker.com -o get-docker.sh
            sh get-docker.sh
            rm get-docker.sh
            sudo usermod -aG docker $USER
      - name: Set up Docker Compose
        run: |
            sudo apt-get update
            sudo apt-get install -y docker-compose
      - name: Prune Docker Networks
        run: docker network prune -f
      - name: Create Docker Network
        run: docker network create --driver bridge --subnet=172.20.0.0/24 kafka-net
      - name: Start Kafka Broker
        run: docker-compose up -d
      - name: Wait for Kafka to start
        run: |
          timeout 60 bash -c 'until nc -zv localhost 9092; do echo "Waiting for Kafka..."; sleep 2; done; echo "Kafka is up!"'
      - name: Run Unit Tests with pytest
        run: |
          pytest -v ./tests/unit
      - name: Run Integration Tests with pytest
        run: |
          pytest -v ./tests/integration
      - name: Tear down Docker Compose
        if: always()
        run: docker-compose down
