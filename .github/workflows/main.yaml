name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F70,F72,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=127 --statistics
      - name: Install Docker
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          rm get-docker.sh
          sudo usermod -aG docker $USER
      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Check Docker Version
        run: docker --version
      - name: Check Docker Compose Version
        run: docker-compose --version
      - name: Prune Docker Networks
        run: docker network prune -f
      - name: Create Docker Network
        run: docker network create --driver bridge --subnet=172.21.0.0/24 kafka-net
      - name: Start Kafka Broker
        run: |
          docker-compose up -d
          echo "Docker Compose started"
          docker ps -a
          docker inspect kafka-broker # Log container details
      - name: Wait for Kafka to be Ready
        run: |
          # Wait for the Kafka broker to be ready by listing topics.
          timeout 60 bash -c '
            for i in $(seq 1 10); do # Retry loop
              echo "Attempt \$i: Checking Kafka readiness..."
              if docker exec kafka-broker kafka-topics.sh --bootstrap-server kafka:9092 --list; then
                echo "Kafka broker is ready!"
                break
              else
                echo "Kafka broker not ready yet. Sleeping for 5 seconds..."
                sleep 5
              fi
              if [ \$i -eq 10 ]; then
                echo "Failed to connect to Kafka after 10 attempts."
                exit 1
              fi
            done
          '
      - name: Run Unit Tests with pytest
        env:
          KAFKA_CONNECT_TIMEOUT: "30" # Increased timeout
          KAFKA_RETRY_BACKOFF_MS: "1000" # Add retry backoff
          KAFKA_MAX_RETRIES: "3"
        run: |
          pytest -v ./tests/unit
      - name: Run Integration Tests with pytest
        env:
          KAFKA_CONNECT_TIMEOUT: "30" # Increased timeout
          KAFKA_RETRY_BACKOFF_MS: "1000" # Add retry backoff
          KAFKA_MAX_RETRIES: "3"
        run: |
          pytest -v ./tests/integration
      - name: Tear down Docker Compose
        if: always()
        run: |
          docker-compose down
          echo "Docker Compose stopped"
